services:
  # 1. FastAPI REST Serving Layer
  - type: web
    name: financial-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port 8000
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: POSTGRES_HOST
        value: "ep-still-heart-a6iddbcp-pooler.us-west-2.aws.neon.tech"
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: "neondb"
      - key: POSTGRES_USER
        value: "neondb_owner"
      - key: POSTGRES_PASSWORD
        value: "npg_9mbkxBlLq2CQ"
      - key: POSTGRES_SSLMODE
        value: "require"

  # 2. Streamlit Dashboard
  - type: web
    name: streamlit-dashboard
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run dashboard/app.py --server.port 8501 --server.headless true --server.fileWatcherType none
    plan: free
    envVars:
      - key: PORT
        value: "8501"
      - key: API_BASE_URL
        value: "https://financial-api-mwp5.onrender.com"

  # 3. Continuous Yahoo Finance Live Streaming Worker
  - type: worker
    name: market-producer
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python scripts/ingest_yfinance_live.py --worker
    plan: free
    envVars:
      - key: POSTGRES_HOST
        value: "ep-still-heart-a6iddbcp-pooler.us-west-2.aws.neon.tech"
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: "neondb"
      - key: POSTGRES_USER
        value: "neondb_owner"
      - key: POSTGRES_PASSWORD
        value: "npg_9mbkxBlLq2CQ"
      - key: POSTGRES_SSLMODE
        value: "require"
      - key: RUN_WORKER
        value: "true"
